<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Dashboard — Nexus Gaming</title>
  <meta name="description" content="Manage your Nexus Gaming profile, subscriptions, avatar, and gear orders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-nexus-950 text-text-primary font-body antialiased min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 bg-nexus-900/80 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-accent to-magenta-accent flex items-center justify-center shadow-lg shadow-cyan-accent/20">
          <i data-lucide="gamepad-2" class="w-6 h-6 text-nexus-900"></i>
        </div>
        <span class="text-2xl font-bold font-heading tracking-wider bg-gradient-to-r from-white via-gray-200 to-cyan-accent bg-clip-text text-transparent">NEXUS</span>
      </a>

      <nav class="hidden md:flex items-center gap-6">
        <a href="/" class="text-sm font-medium text-text-secondary hover:text-cyan-accent transition-colors uppercase">Storefront</a>
        <a href="/#products" class="text-sm font-medium text-text-secondary hover:text-cyan-accent transition-colors uppercase">Gaming Gear</a>
        <a href="/#subscriptions" class="text-sm font-medium text-text-secondary hover:text-cyan-accent transition-colors uppercase">Subscriptions</a>
        <a href="/cart.html" class="text-sm font-medium text-text-secondary hover:text-cyan-accent transition-colors uppercase">Loadout Cart</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="/cart.html" class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-text-primary border border-white/5 transition-colors">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </a>
        <button onclick="window.nexusCustomerLogout()" class="text-xs font-semibold px-3 py-2 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500 hover:text-white transition-all flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
    
    <!-- Profile Hero Card -->
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-nexus-800/90 to-nexus-900/90 border border-white/10 p-6 sm:p-8 backdrop-blur-xl shadow-2xl">
      <div class="absolute -right-20 -top-20 w-80 h-80 bg-cyan-accent/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 relative z-10">
        <!-- Avatar with Upload Overlay -->
        <div class="relative group cursor-pointer" onclick="document.getElementById('avatarFileInput').click()">
          <img id="userAvatarImg" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?auto=format&fit=crop&w=300&q=80" alt="Avatar" class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl object-cover border-2 border-cyan-accent shadow-xl shadow-cyan-accent/20" />
          <div class="absolute inset-0 bg-black/60 rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center text-white text-xs font-medium">
            <i data-lucide="camera" class="w-6 h-6 mb-1 text-cyan-accent"></i>
            <span>Change Photo</span>
          </div>
          <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        </div>

        <!-- User Info -->
        <div class="flex-1 text-center sm:text-left space-y-2">
          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3">
            <h1 class="text-2xl sm:text-3xl font-bold font-heading tracking-wide text-white" id="userName">Gamer</h1>
            <span id="roleBadge" class="px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-cyan-accent/20 text-cyan-accent border border-cyan-accent/30 uppercase">User</span>
          </div>

          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-4 text-xs font-mono text-gray-400">
            <span class="text-cyan-accent font-semibold flex items-center gap-1">
              <i data-lucide="at-sign" class="w-3.5 h-3.5"></i> <span id="userHandle">username</span>
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="mail" class="w-3.5 h-3.5"></i> <span id="userEmail">email@example.com</span>
            </span>
            <span class="px-2 py-0.5 rounded bg-white/5 border border-white/10 text-gray-300 flex items-center gap-1.5 cursor-pointer hover:border-cyan-accent" onclick="copyUserId()" title="Click to copy ID">
              <i data-lucide="fingerprint" class="w-3.5 h-3.5 text-cyan-accent"></i> ID: <span id="userIdCode">NXS-0000</span>
              <i data-lucide="copy" class="w-3 h-3 text-gray-400"></i>
            </span>
          </div>

          <p class="text-sm text-gray-300 pt-1" id="userBio">Nexus Gamer & Gear Enthusiast</p>
        </div>

        <!-- Quick Action Buttons -->
        <div class="flex sm:flex-col gap-2 w-full sm:w-auto">
          <button onclick="openEditProfileModal()" class="flex-1 sm:flex-initial px-4 py-2 bg-nexus-700 hover:bg-nexus-600 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border border-white/10 transition-colors">
            <i data-lucide="user-cog" class="w-4 h-4 text-cyan-accent"></i> Edit Profile
          </button>
          <div id="adminPortalQuickBtn"></div>
        </div>
      </div>
    </div>

    <!-- Grid Sections: Subscriptions + Recent Orders -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left Column: Active Subscription & Perks -->
      <div class="space-y-6">
        <div id="gamePassCard" class="bg-nexus-800/80 border border-white/10 rounded-3xl p-6 backdrop-blur-xl space-y-4">
          <!-- Dynamically populated from real user orders/subscriptions -->
          <div class="text-center py-6 text-gray-500 text-xs">Loading membership status...</div>
        </div>
      </div>

      <!-- Right Column: Order History -->
      <div class="lg:col-span-2 space-y-6" id="orders">
        <div class="bg-nexus-800/80 border border-white/10 rounded-3xl p-6 backdrop-blur-xl space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold font-heading flex items-center gap-2">
              <i data-lucide="package" class="w-5 h-5 text-cyan-accent"></i> Order History
            </h3>
            <span id="orderCountBadge" class="text-xs font-mono text-gray-400">Loading...</span>
          </div>

          <div id="ordersContainer" class="space-y-3">
            <div class="p-8 text-center text-gray-400 text-sm">
              <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-cyan-accent"></i>
              Loading your gear orders...
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div id="editProfileModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-md hidden p-4">
    <div class="bg-nexus-800 border border-white/10 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl animate-fade-in text-white">
      <div class="p-6 border-b border-white/10 flex items-center justify-between">
        <h3 class="text-xl font-bold font-heading">Edit Gamer Profile</h3>
        <button onclick="closeEditProfileModal()" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="editProfileForm" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5">Gamer Name</label>
          <input type="text" id="editNameInput" required class="w-full px-4 py-3 bg-nexus-900 border border-white/20 rounded-xl text-white text-sm font-medium outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent placeholder:text-gray-500 transition-all shadow-inner" style="color: #ffffff !important; background-color: #0a0e17 !important;">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">Username (@handle)</label>
            <span id="editUsernameStatus" class="text-xs font-mono"></span>
          </div>
          <input type="text" id="editUsernameInput" required class="w-full px-4 py-3 bg-nexus-900 border border-white/20 rounded-xl text-white text-sm font-mono outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent placeholder:text-gray-500 transition-all shadow-inner" style="color: #ffffff !important; background-color: #0a0e17 !important;">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1.5">Bio / Status</label>
          <textarea id="editBioInput" rows="3" maxlength="250" class="w-full px-4 py-3 bg-nexus-900 border border-white/20 rounded-xl text-white text-sm font-medium outline-none focus:border-cyan-accent focus:ring-1 focus:ring-cyan-accent placeholder:text-gray-500 transition-all shadow-inner resize-none" style="color: #ffffff !important; background-color: #0a0e17 !important;"></textarea>
        </div>

        <div id="profileFormError" class="text-rose-400 text-xs hidden"></div>

        <div class="flex justify-end gap-3 pt-3 border-t border-white/10">
          <button type="button" onclick="closeEditProfileModal()" class="px-4 py-2 border border-white/10 hover:bg-white/5 rounded-xl text-xs text-gray-300 hover:text-white transition-colors">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-cyan-accent hover:bg-cyan-400 text-nexus-900 font-bold rounded-xl text-xs shadow-lg shadow-cyan-accent/20 transition-all">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="userToastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <script src="./src/auth-modal.js" type="module"></script>
  <script type="module">
    import { getCustomerUser, customerLogout } from './src/auth-modal.js';

    let currentUser = null;
    let editUsernameTimer = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (window.lucide) lucide.createIcons();
      await loadUserProfile();
      loadUserOrders();

      // Avatar upload event listener
      const avatarInput = document.getElementById('avatarFileInput');
      avatarInput.addEventListener('change', handleAvatarUpload);

      // Edit Username Live Check
      const usernameInput = document.getElementById('editUsernameInput');
      usernameInput.addEventListener('input', (e) => {
        clearTimeout(editUsernameTimer);
        const val = e.target.value.trim().toLowerCase();
        const statusEl = document.getElementById('editUsernameStatus');

        if (currentUser && val === currentUser.username) {
          statusEl.innerHTML = '';
          return;
        }

        if (!val || val.length < 3) {
          statusEl.innerHTML = '<span class="text-gray-400">Min 3 chars</span>';
          return;
        }

        statusEl.innerHTML = '<span class="text-cyan-accent animate-pulse">Checking...</span>';

        editUsernameTimer = setTimeout(async () => {
          try {
            const res = await fetch(`/api/auth/check-username?username=${encodeURIComponent(val)}`);
            const data = await res.json();
            if (data.available) {
              statusEl.innerHTML = '<span class="text-emerald-400 font-semibold">✓ Available</span>';
            } else {
              statusEl.innerHTML = `<span class="text-rose-400 font-semibold">✗ ${data.error || 'Taken'}</span>`;
            }
          } catch (err) {
            statusEl.innerHTML = '<span class="text-rose-400">Check failed</span>';
          }
        }, 100);
      });

      // Submit Edit Profile Form
      document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('editNameInput').value.trim();
        const username = document.getElementById('editUsernameInput').value.trim().toLowerCase();
        const bio = document.getElementById('editBioInput').value.trim();
        const errorEl = document.getElementById('profileFormError');
        errorEl.classList.add('hidden');

        const token = localStorage.getItem('nexus_customer_token');
        try {
          const res = await fetch('/api/auth/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ name, username, bio })
          });
          const data = await res.json();

          if (!data.success) throw new Error(data.error || 'Failed to update profile.');

          localStorage.setItem('nexus_customer_user', JSON.stringify(data.data));
          currentUser = data.data;
          renderUserProfile(currentUser);
          closeEditProfileModal();
          showUserToast('Profile updated successfully!', 'success');
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.remove('hidden');
        }
      });
    });

    async function loadUserProfile() {
      const token = localStorage.getItem('nexus_customer_token');
      if (!token) {
        // If not logged in, prompt sign in
        window.location.href = '/';
        return;
      }

      try {
        const res = await fetch('/api/auth/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!data.success) throw new Error();

        currentUser = data.data;
        localStorage.setItem('nexus_customer_user', JSON.stringify(currentUser));
        renderUserProfile(currentUser);
      } catch (err) {
        console.error('Failed to load profile:', err);
        const cached = getCustomerUser();
        if (cached) {
          currentUser = cached;
          renderUserProfile(currentUser);
        }
      }
    }

    function renderUserProfile(user) {
      if (!user) return;
      document.getElementById('userName').textContent = user.name || 'Gamer';
      document.getElementById('userHandle').textContent = user.username || 'gamer';
      document.getElementById('userEmail').textContent = user.email || '';
      document.getElementById('userIdCode').textContent = user.userId || 'NXS-USER';
      document.getElementById('userBio').textContent = user.bio || 'Nexus Gamer & Gear Enthusiast';
      
      const avatarSrc = user.avatar || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?auto=format&fit=crop&w=300&q=80';
      document.getElementById('userAvatarImg').src = avatarSrc;

      const roleBadge = document.getElementById('roleBadge');
      if (user.role === 'super_admin') {
        roleBadge.textContent = 'Super Admin';
        roleBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-gold-accent/20 text-gold-accent border border-gold-accent/40 uppercase';
      } else if (user.role === 'admin') {
        roleBadge.textContent = 'Admin';
        roleBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-cyan-accent/20 text-cyan-accent border border-cyan-accent/40 uppercase';
      } else {
        roleBadge.textContent = 'Gamer';
        roleBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-mono font-bold bg-gray-500/20 text-gray-300 border border-gray-500/30 uppercase';
      }

      if (user.role === 'admin' || user.role === 'super_admin') {
        document.getElementById('adminPortalQuickBtn').innerHTML = `
          <a href="/admin/" target="_blank" class="px-4 py-2 bg-gradient-to-r from-gold-accent to-amber-500 text-nexus-950 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-lg shadow-gold-accent/20">
            <i data-lucide="shield" class="w-3.5 h-3.5"></i> Admin Portal
          </a>
        `;
        if (window.lucide) lucide.createIcons();
      }
    }

    async function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const token = localStorage.getItem('nexus_customer_token');
      if (!token) return;

      const formData = new FormData();
      formData.append('avatar', file);

      showUserToast('Uploading profile picture...', 'info');

      try {
        const res = await fetch('/api/auth/avatar', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();

        if (!data.success) throw new Error(data.error || 'Avatar upload failed');

        currentUser.avatar = data.avatar;
        localStorage.setItem('nexus_customer_user', JSON.stringify(currentUser));
        document.getElementById('userAvatarImg').src = data.avatar;
        showUserToast('Profile picture updated successfully!', 'success');
      } catch (err) {
        showUserToast(err.message || 'Upload failed', 'error');
      }
    }

    async function loadUserOrders() {
      const token = localStorage.getItem('nexus_customer_token');
      if (!token) return;

      const container = document.getElementById('ordersContainer');
      const badge = document.getElementById('orderCountBadge');

      try {
        const res = await fetch('/api/orders/my', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        const orders = data.data || [];
        badge.textContent = `${orders.length} orders`;
        updateGamePassCard(orders);

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="p-8 text-center border border-dashed border-white/10 rounded-2xl space-y-3">
              <i data-lucide="shopping-cart" class="w-10 h-10 text-gray-500 mx-auto"></i>
              <p class="text-sm text-gray-400">You haven't placed any orders yet.</p>
              <a href="/#products" class="inline-block px-4 py-2 bg-cyan-accent text-nexus-900 font-bold rounded-xl text-xs">
                Explore Gaming Gear
              </a>
            </div>
          `;
          if (window.lucide) lucide.createIcons();
          return;
        }

        container.innerHTML = orders.map(order => {
          const date = new Date(order.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
          const itemsSummary = (order.items || []).map(i => `${i.qty}x ${i.name}`).join(', ');

          let statusClass = 'bg-cyan-accent/20 text-cyan-accent border-cyan-accent/30';
          if (order.status === 'delivered') statusClass = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
          else if (order.status === 'processing') statusClass = 'bg-blue-500/20 text-blue-300 border-blue-500/30';
          else if (order.status === 'cancelled') statusClass = 'bg-rose-500/20 text-rose-300 border-rose-500/30';

          return `
            <div class="p-4 rounded-2xl bg-nexus-900/60 border border-white/5 hover:border-white/15 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-mono font-bold text-sm text-white">${order.orderNumber}</span>
                  <span class="px-2 py-0.5 rounded text-[10px] font-semibold border ${statusClass} uppercase">${order.status}</span>
                </div>
                <p class="text-xs text-gray-400 line-clamp-1">${itemsSummary}</p>
                <p class="text-[11px] text-gray-500">${date}</p>
              </div>
              <div class="flex sm:flex-col items-end justify-between sm:justify-center border-t sm:border-t-0 border-white/5 pt-2 sm:pt-0">
                <span class="text-base font-bold font-mono text-cyan-accent">$${Math.round(order.total)}</span>
                <span class="text-[11px] text-gray-400">${order.items?.length || 0} items</span>
              </div>
            </div>
          `;
        }).join('');

        if (window.lucide) lucide.createIcons();
      } catch (err) {
        container.innerHTML = `<div class="p-4 text-center text-rose-400 text-xs">Failed to load orders.</div>`;
      }
    }

    function updateGamePassCard(orders) {
      const passContainer = document.getElementById('gamePassCard');
      if (!passContainer) return;

      const subOrder = (orders || []).find(o => o.items && o.items.some(i => i.name && (i.name.toLowerCase().includes('pass') || i.name.toLowerCase().includes('tier') || i.name.toLowerCase().includes('subscription'))));

      if (subOrder) {
        const subItem = subOrder.items.find(i => i.name && (i.name.toLowerCase().includes('pass') || i.name.toLowerCase().includes('tier') || i.name.toLowerCase().includes('subscription')));
        passContainer.innerHTML = `
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold font-heading flex items-center gap-2">
              <i data-lucide="crown" class="w-5 h-5 text-gold-accent"></i> My Game Pass
            </h3>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-mono">ACTIVE VIP</span>
          </div>

          <div class="p-4 rounded-2xl bg-gradient-to-br from-nexus-900 to-nexus-800 border border-gold-accent/30 space-y-3">
            <div class="flex items-baseline justify-between">
              <div>
                <p class="text-xs text-gray-400 uppercase tracking-wider">Current Membership</p>
                <h4 class="text-xl font-bold font-heading text-white">${subItem.name}</h4>
              </div>
              <span class="text-lg font-bold font-mono text-cyan-accent">$${Math.round(subItem.price)}<span class="text-xs text-gray-400 font-normal">/mo</span></span>
            </div>

            <ul class="text-xs text-gray-300 space-y-2 pt-2 border-t border-white/5">
              <li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-emerald-400"></i> Full Games Vault Access</li>
              <li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-emerald-400"></i> Low Latency Cloud Gaming</li>
              <li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-emerald-400"></i> 15% Store Hardware Discount</li>
              <li class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4 text-emerald-400"></i> 24/7 VIP Priority Support</li>
            </ul>
          </div>

          <a href="/#subscriptions" class="block w-full py-2.5 text-center text-xs font-bold rounded-xl bg-white/5 hover:bg-cyan-accent hover:text-nexus-900 border border-white/10 transition-all">
            Manage / Change Plan
          </a>
        `;
      } else {
        passContainer.innerHTML = `
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold font-heading flex items-center gap-2">
              <i data-lucide="crown" class="w-5 h-5 text-gray-400"></i> Game Pass Status
            </h3>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-white/10 text-gray-400 border border-white/10 font-mono">NO ACTIVE PASS</span>
          </div>

          <div class="p-5 rounded-2xl bg-nexus-900/60 border border-white/10 space-y-3 text-center">
            <div class="w-10 h-10 rounded-xl bg-cyan-accent/10 text-cyan-accent flex items-center justify-center mx-auto">
              <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
            <h4 class="text-base font-bold font-heading text-white">Unlock 1000+ Games</h4>
            <p class="text-xs text-gray-400">Subscribe to Nexus Game Pass for instant cloud gaming and VIP store discounts.</p>
            <a href="/#subscriptions" class="inline-block w-full py-2.5 text-center text-xs font-bold rounded-xl bg-cyan-accent text-nexus-950 hover:bg-cyan-400 shadow-glow-cyan-sm transition-all">
              Explore Game Passes (from $10/mo)
            </a>
          </div>
        `;
      }

      if (window.lucide) lucide.createIcons();
    }

    window.openEditProfileModal = function() {
      if (!currentUser) return;
      document.getElementById('editNameInput').value = currentUser.name || '';
      document.getElementById('editUsernameInput').value = currentUser.username || '';
      document.getElementById('editBioInput').value = currentUser.bio || '';
      document.getElementById('editUsernameStatus').innerHTML = '';
      document.getElementById('editProfileModal').classList.remove('hidden');
    };

    window.closeEditProfileModal = function() {
      document.getElementById('editProfileModal').classList.add('hidden');
    };

    window.copyUserId = function() {
      const code = document.getElementById('userIdCode').textContent;
      navigator.clipboard.writeText(code);
      showUserToast(`User ID ${code} copied to clipboard!`, 'success');
    };

    function showUserToast(message, type = 'success') {
      const container = document.getElementById('userToastContainer');
      const colors = {
        success: 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300',
        error: 'bg-rose-500/20 border-rose-500/50 text-rose-300',
        info: 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300'
      };
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-xl border backdrop-blur-xl shadow-xl text-xs font-semibold ${colors[type] || colors.info} animate-fade-in`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }
  </script>
</body>
</html>
