<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" width="100%" height="100%">
  <defs>
    <filter id="ffHeroShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
    <filter id="flameBladeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="ffArmor" x1="180" y1="200" x2="420" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="650" rx="180" ry="22" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="650" rx="120" ry="14" fill="#f59e0b" opacity="0.25"/>

  <!-- Flaming Energy Wings & Aura -->
  <path d="M220 280 C120 180 60 300 100 440 C140 380 180 340 220 320 Z" fill="url(#flameGrad)" opacity="0.85" filter="url(#flameBladeGlow)"/>
  <path d="M380 280 C480 180 540 300 500 440 C460 380 420 340 380 320 Z" fill="url(#flameGrad)" opacity="0.85" filter="url(#flameBladeGlow)"/>

  <!-- Character Group -->
  <g filter="url(#ffHeroShadow)">
    
    <!-- Cyberpunk Battle Suit -->
    <path d="M220 240 L380 240 L390 460 L210 460 Z" fill="url(#ffArmor)" stroke="#475569" stroke-width="2"/>
    <polygon points="260,240 340,240 320,380 280,380" fill="url(#flameGrad)" opacity="0.9"/>

    <!-- Glowing Cyber Katana Blade -->
    <g transform="rotate(40 360 320)" filter="url(#flameBladeGlow)">
      <rect x="360" y="80" width="14" height="380" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <polygon points="360,80 374,80 367,40" fill="#fef08a"/>
      <rect x="350" y="460" width="34" height="12" rx="3" fill="#1e293b"/>
      <rect x="362" y="472" width="10" height="90" rx="4" fill="#0f172a" stroke="#d97706"/>
    </g>

    <!-- Arms & Gauntlets -->
    <circle cx="180" cy="360" r="22" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="420" cy="360" r="22" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2"/>

    <!-- Head & Cyber Visor Sunglasses -->
    <ellipse cx="300" cy="150" rx="38" ry="48" fill="#fcd34d"/>
    <path d="M260 140 C255 80 345 75 345 130 C350 150 335 155 325 155 C310 100 275 105 268 145 Z" fill="#18181b"/>
    <!-- Cyber Neon Visor -->
    <polygon points="270,145 330,145 320,165 280,165" fill="#f59e0b" filter="url(#flameBladeGlow)"/>
  </g>
</svg>
