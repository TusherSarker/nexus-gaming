<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" width="100%" height="100%">
  <defs>
    <!-- Shading & Lighting Filters -->
    <filter id="messi3dGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
    <filter id="ballEnergyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="jerseyGrad" x1="180" y1="200" x2="420" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="35%" stop-color="#002b80"/>
      <stop offset="70%" stop-color="#00144d"/>
      <stop offset="100%" stop-color="#000a26"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d47f97"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd8b8"/>
      <stop offset="60%" stop-color="#d99b70"/>
      <stop offset="100%" stop-color="#8c5836"/>
    </linearGradient>
    <radialGradient id="ball3D" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <linearGradient id="speedArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d47f97" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="660" rx="180" ry="22" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="660" rx="120" ry="14" fill="#00f0ff" opacity="0.25"/>

  <!-- Electric Speed Waves / Energy Kick Trails -->
  <path d="M120 540 Q 250 590 480 480" stroke="url(#speedArc)" stroke-width="8" stroke-linecap="round" filter="url(#ballEnergyGlow)"/>
  <path d="M160 510 Q 270 560 460 450" stroke="url(#speedArc)" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 480 Q 300 520 440 430" stroke="url(#speedArc)" stroke-width="2" stroke-linecap="round"/>

  <!-- Character Group -->
  <g filter="url(#messi3dGlow)">
    
    <!-- Athletic Legs & Cleats (Mid-Air Strike Pose) -->
    <!-- Supporting Leg -->
    <path d="M250 460 L240 570 L210 610 L260 620 L270 570 L290 460 Z" fill="#00144d" stroke="#000a26" stroke-width="2"/>
    <!-- Golden Match Cleat (Support) -->
    <path d="M210 610 L190 625 L250 635 L260 620 Z" fill="url(#goldTrim)" stroke="#b45309" stroke-width="1.5"/>

    <!-- Kicking Leg (Striking Right Leg Extended Forward) -->
    <path d="M320 450 L380 500 L440 520 L450 490 L380 440 Z" fill="#00144d" stroke="#000a26" stroke-width="2"/>
    <path d="M440 520 L480 535 L470 505 L450 490 Z" fill="url(#skinTone)"/>
    <!-- Golden Cleat (Striking) -->
    <path d="M470 505 L520 490 L510 525 L475 540 Z" fill="url(#goldTrim)" stroke="#b45309" stroke-width="2" filter="url(#ballEnergyGlow)"/>

    <!-- Athletic Torso & #10 Esports Jersey -->
    <path d="M230 240 L370 230 L380 460 L230 460 Z" fill="url(#jerseyGrad)" stroke="#0052cc" stroke-width="2"/>
    
    <!-- Gold Trim Diagonal Cyber Stripes -->
    <path d="M250 240 L280 240 L310 460 L280 460 Z" fill="url(#goldTrim)" opacity="0.85"/>
    <path d="M320 235 L345 235 L365 460 L340 460 Z" fill="url(#goldTrim)" opacity="0.85"/>

    <!-- Signature Number 10 Gold Badge -->
    <text x="300" y="360" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="64" fill="url(#goldTrim)" text-anchor="middle" letter-spacing="2">10</text>
    <text x="300" y="285" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="4">MESSI</text>

    <!-- Arms & Athletic Dynamic Pose -->
    <!-- Left Balance Arm -->
    <path d="M230 240 L160 300 L180 340 L240 280 Z" fill="url(#jerseyGrad)"/>
    <path d="M160 300 L120 360 L145 375 L180 340 Z" fill="url(#skinTone)"/>
    
    <!-- Right Thrust Arm -->
    <path d="M370 230 L430 290 L405 325 L360 270 Z" fill="url(#jerseyGrad)"/>
    <path d="M430 290 L470 345 L445 365 L405 325 Z" fill="url(#skinTone)"/>

    <!-- Head, Face & Iconic Hair -->
    <!-- Neck -->
    <path d="M280 200 L320 195 L325 245 L275 245 Z" fill="url(#skinTone)"/>
    
    <!-- Head Contour -->
    <ellipse cx="300" cy="155" rx="42" ry="52" fill="url(#skinTone)"/>
    
    <!-- Iconic Beard & Features -->
    <path d="M275 165 Q 300 205 325 165 Q 320 185 300 195 Q 280 185 275 165 Z" fill="#4a2c11"/>
    
    <!-- Flowing 3D Athletic Hair -->
    <path d="M260 145 C255 95 345 85 345 135 C350 155 340 160 330 160 C320 120 280 120 270 155 C265 155 260 150 260 145 Z" fill="#3b2314"/>

    <!-- Captain's Gold Armband -->
    <rect x="195" y="275" width="45" height="18" rx="4" fill="url(#goldTrim)" stroke="#ffd700" stroke-width="1.5" transform="rotate(-30 195 275)"/>
  </g>

  <!-- 3D Electric Match Ball (Positioned at Point of Kick) -->
  <g transform="translate(480, 440)" filter="url(#ballEnergyGlow)">
    <circle cx="0" cy="0" r="46" fill="url(#ball3D)" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Soccer Hexagon / Polygon Patches -->
    <polygon points="0,-18 16,-6 10,14 -10,14 -16,-6" fill="#0f172a"/>
    <polygon points="0,-46 12,-32 -12,-32" fill="#0f172a"/>
    <polygon points="38,-14 44,6 28,0" fill="#0f172a"/>
    <polygon points="-38,-14 -44,6 -28,0" fill="#0f172a"/>
    <polygon points="26,36 10,44 18,24" fill="#0f172a"/>
    <polygon points="-26,36 -10,44 -18,24" fill="#0f172a"/>

    <!-- Energy Ring around Ball -->
    <circle cx="0" cy="0" r="54" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="25 15" opacity="0.8"/>
  </g>

  <!-- Floating Sparkles & Champions League Stars -->
  <polygon points="150,160 153,168 162,168 155,173 158,181 150,176 142,181 145,173 138,168 147,168" fill="#ffd700" opacity="0.85"/>
  <polygon points="450,180 452,186 459,186 453,190 456,196 450,192 444,196 447,190 441,186 448,186" fill="#00f0ff" opacity="0.85"/>
  <circle cx="220" cy="120" r="4" fill="#d47f97" opacity="0.8"/>
</svg>
