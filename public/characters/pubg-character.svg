<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" width="100%" height="100%">
  <defs>
    <!-- Shading & Lighting Filters -->
    <filter id="pubg3dDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#d47f97" flood-opacity="0.35"/>
    </filter>
    <filter id="goldVisorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradients for 3D Shading -->
    <linearGradient id="helmetShell" x1="150" y1="80" x2="450" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d4452"/>
      <stop offset="35%" stop-color="#212631"/>
      <stop offset="80%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="visorGoldGrad" x1="200" y1="170" x2="400" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="40%" stop-color="#f5a623"/>
      <stop offset="85%" stop-color="#d0021b"/>
      <stop offset="100%" stop-color="#4a000d"/>
    </linearGradient>
    <linearGradient id="jacketLeather" x1="100" y1="260" x2="500" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#544339"/>
      <stop offset="30%" stop-color="#332720"/>
      <stop offset="70%" stop-color="#1e1612"/>
      <stop offset="100%" stop-color="#0d0907"/>
    </linearGradient>
    <linearGradient id="armorPlate" x1="200" y1="300" x2="400" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="50%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="weaponSteel" x1="100" y1="320" x2="550" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#697689"/>
      <stop offset="50%" stop-color="#2f3744"/>
      <stop offset="100%" stop-color="#151a22"/>
    </linearGradient>
    <linearGradient id="duskyPinkGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2bfcd"/>
      <stop offset="50%" stop-color="#d47f97"/>
      <stop offset="100%" stop-color="#b56078"/>
    </linearGradient>
  </defs>

  <!-- Ground Ambient Under-Glow (Subtle 3D Floating Shadow) -->
  <ellipse cx="300" cy="650" rx="200" ry="25" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="650" rx="140" ry="16" fill="url(#duskyPinkGlowGrad)" opacity="0.25"/>

  <!-- Character Group with 3D Drop Shadow -->
  <g filter="url(#pubg3dDropShadow)">
    
    <!-- Trenchcoat Wings & Shoulders (Back Layer) -->
    <path d="M140 320 C110 400 80 540 100 620 C120 630 180 580 200 520 L220 360 Z" fill="url(#jacketLeather)" stroke="#1a130f" stroke-width="2"/>
    <path d="M460 320 C490 400 520 540 500 620 C480 630 420 580 400 520 L380 360 Z" fill="url(#jacketLeather)" stroke="#1a130f" stroke-width="2"/>

    <!-- Tactical Torso & Tactical Vest -->
    <path d="M210 260 L390 260 L420 460 L370 560 L230 560 L180 460 Z" fill="url(#jacketLeather)"/>
    <!-- Tactical Molle Armor Vest -->
    <path d="M230 280 L370 280 L385 450 L345 500 L255 500 L215 450 Z" fill="url(#armorPlate)" stroke="#3d495c" stroke-width="2.5"/>
    
    <!-- Molle Webbing Straps -->
    <line x1="245" y1="330" x2="355" y2="330" stroke="#4a5568" stroke-width="4" stroke-dasharray="14 5"/>
    <line x1="240" y1="370" x2="360" y2="370" stroke="#4a5568" stroke-width="4" stroke-dasharray="14 5"/>
    <line x1="245" y1="410" x2="355" y2="410" stroke="#4a5568" stroke-width="4" stroke-dasharray="14 5"/>
    
    <!-- Mag Pouches -->
    <rect x="250" y="430" width="28" height="42" rx="4" fill="#1b222d" stroke="#374151" stroke-width="1.5"/>
    <rect x="286" y="430" width="28" height="42" rx="4" fill="#1b222d" stroke="#374151" stroke-width="1.5"/>
    <rect x="322" y="430" width="28" height="42" rx="4" fill="#1b222d" stroke="#374151" stroke-width="1.5"/>

    <!-- AWM Sniper Rifle (Slung / Across Chest) -->
    <g transform="rotate(-15 300 420)">
      <!-- Long Barrel -->
      <rect x="60" y="385" width="470" height="12" rx="3" fill="url(#weaponSteel)" stroke="#111827" stroke-width="1.5"/>
      <!-- Muzzle Brake -->
      <rect x="520" y="380" width="22" height="22" rx="2" fill="#1f2937" stroke="#4b5563"/>
      <!-- Sniper Scope -->
      <rect x="230" y="358" width="130" height="20" rx="6" fill="#1f2937" stroke="#374151" stroke-width="2"/>
      <circle cx="240" cy="368" r="8" fill="#d47f97" opacity="0.85" filter="url(#goldVisorGlow)"/>
      <circle cx="350" cy="368" r="8" fill="#d47f97" opacity="0.85" filter="url(#goldVisorGlow)"/>
      <!-- Rifle Body / Stock -->
      <path d="M150 385 L320 385 L300 435 L220 440 L150 415 Z" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
    </g>

    <!-- Arms & Tactical Gloves -->
    <path d="M180 270 L140 370 L190 410 L230 330 Z" fill="url(#jacketLeather)"/>
    <circle cx="190" cy="410" r="20" fill="#1a1c23" stroke="#374151" stroke-width="2"/>
    
    <path d="M420 270 L460 370 L410 410 L370 330 Z" fill="url(#jacketLeather)"/>
    <circle cx="410" cy="410" r="20" fill="#1a1c23" stroke="#374151" stroke-width="2"/>

    <!-- Neck & Balaclava -->
    <path d="M260 220 L340 220 L350 280 L250 280 Z" fill="#1a1f28"/>

    <!-- Signature Level 3 Spetsnaz Helmet -->
    <!-- Outer Dome Shell -->
    <path d="M190 170 C190 75 410 75 410 170 C410 240 395 260 380 270 L220 270 C205 260 190 240 190 170 Z" fill="url(#helmetShell)" stroke="#4b5563" stroke-width="3"/>
    
    <!-- Top Center Armor Ridge / Crease -->
    <path d="M300 75 Q295 140 300 210" stroke="#5a6578" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Heavy Metal Visor Faceplate -->
    <path d="M205 150 L395 150 C405 150 410 165 405 185 L385 245 C380 255 370 260 360 260 L240 260 C230 260 220 255 215 245 L195 185 C190 165 195 150 205 150 Z" fill="#1e2430" stroke="#475569" stroke-width="2.5"/>

    <!-- Gold Tinted Armored Viewing Slit -->
    <g filter="url(#goldVisorGlow)">
      <polygon points="225,185 375,185 370,215 230,215" fill="url(#visorGoldGrad)" stroke="#ffd700" stroke-width="1.5"/>
      <!-- Glass Glare Highlight -->
      <polygon points="235,188 320,188 305,212 240,212" fill="#ffffff" opacity="0.45"/>
    </g>

    <!-- Heavy Visor Hinges & Rivets -->
    <circle cx="205" cy="180" r="6" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <circle cx="395" cy="180" r="6" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <circle cx="250" cy="245" r="3" fill="#94a3b8"/>
    <circle cx="300" cy="248" r="3" fill="#94a3b8"/>
    <circle cx="350" cy="245" r="3" fill="#94a3b8"/>
  </g>

  <!-- Dynamic Floating Sparks & Energy Particles -->
  <circle cx="160" cy="200" r="3" fill="#ffd700" opacity="0.8"/>
  <circle cx="430" cy="140" r="4" fill="#d47f97" opacity="0.9"/>
  <circle cx="120" cy="450" r="3" fill="#ffd700" opacity="0.7"/>
  <circle cx="480" cy="380" r="4.5" fill="#f2bfcd" opacity="0.85"/>
  <circle cx="450" cy="520" r="2.5" fill="#ffd700" opacity="0.6"/>
</svg>
