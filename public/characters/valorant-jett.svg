<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" width="100%" height="100%">
  <defs>
    <filter id="jettShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#2dd4bf" flood-opacity="0.45"/>
    </filter>
    <filter id="windGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="jettHair" x1="200" y1="80" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="jettVest" x1="180" y1="200" x2="420" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="windCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="650" rx="170" ry="20" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="650" rx="110" ry="12" fill="#2dd4bf" opacity="0.25"/>

  <!-- Swirling Wind Vortex Trails -->
  <path d="M120 480 Q 200 620 420 540 Q 520 460 380 340" stroke="url(#windCyan)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#windGlow)" opacity="0.8"/>
  <path d="M160 520 Q 300 640 480 460" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Character Group -->
  <g filter="url(#jettShadow)">
    
    <!-- Dashing Legs & Boots -->
    <path d="M250 440 L210 550 L170 590 L220 605 L245 550 L280 440 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <path d="M170 590 L150 605 L210 615 L220 600 Z" fill="url(#windCyan)" stroke="#0d9488" stroke-width="1.5"/>

    <path d="M320 430 L380 490 L450 510 L460 480 L390 430 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <path d="M450 510 L490 520 L480 495 L460 480 Z" fill="#fbcfe8"/>
    <path d="M480 495 L530 480 L520 515 L485 530 Z" fill="url(#windCyan)" stroke="#0d9488" stroke-width="2"/>

    <!-- Dynamic Duelist Torso & Wind Jacket -->
    <path d="M220 220 L380 220 L390 440 L210 440 Z" fill="url(#jettVest)" stroke="#334155" stroke-width="2"/>
    
    <!-- Radiant Cyan Accents on Jacket -->
    <path d="M240 220 L270 220 L290 440 L270 440 Z" fill="url(#windCyan)" opacity="0.9"/>
    <path d="M330 220 L360 220 L340 440 L320 440 Z" fill="url(#windCyan)" opacity="0.9"/>

    <!-- Arms in Knife Throwing Form -->
    <path d="M220 220 L160 270 L180 310 L230 260 Z" fill="url(#jettVest)"/>
    <path d="M160 270 L120 330 L145 345 L180 310 Z" fill="#fed7aa"/>
    
    <path d="M380 220 L440 270 L420 310 L370 260 Z" fill="url(#jettVest)"/>
    <path d="M440 270 L480 330 L455 345 L420 310 Z" fill="#fed7aa"/>

    <!-- Head & Flowing White Ponytail Hair -->
    <path d="M280 180 L320 180 L325 225 L275 225 Z" fill="#fed7aa"/>
    <ellipse cx="300" cy="140" rx="38" ry="48" fill="#fed7aa"/>
    
    <!-- White Silver Flowing Anime Hair with High Bun -->
    <path d="M260 135 C255 70 345 65 345 120 C350 140 335 150 325 150 C310 100 275 105 268 140 Z" fill="url(#jettHair)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Floating Back Ponytail -->
    <path d="M330 90 C380 40 460 70 440 140 C420 120 380 100 330 90 Z" fill="url(#jettHair)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Floating Radiant Wind Kunai Daggers (Blade Storm) -->
    <g transform="translate(130, 240) rotate(-25)" filter="url(#windGlow)">
      <polygon points="0,-40 12,-10 6,30 0,40 -6,30 -12,-10" fill="#f8fafc" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="0" cy="22" r="5" fill="#0d9488"/>
    </g>

    <g transform="translate(460, 220) rotate(35)" filter="url(#windGlow)">
      <polygon points="0,-40 12,-10 6,30 0,40 -6,30 -12,-10" fill="#f8fafc" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="0" cy="22" r="5" fill="#0d9488"/>
    </g>

    <g transform="translate(300, 70) rotate(-5)" filter="url(#windGlow)">
      <polygon points="0,-40 12,-10 6,30 0,40 -6,30 -12,-10" fill="#f8fafc" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="0" cy="22" r="5" fill="#0d9488"/>
    </g>
  </g>
</svg>
