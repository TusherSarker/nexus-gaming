<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none" width="100%" height="100%">
  <defs>
    <filter id="cr7DropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#e06d92" flood-opacity="0.4"/>
    </filter>
    <filter id="powerStrikeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="crJersey" x1="150" y1="200" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="80%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>
    <linearGradient id="crGoldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="crSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d5b8"/>
      <stop offset="60%" stop-color="#d9996e"/>
      <stop offset="100%" stop-color="#8a532f"/>
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="660" rx="180" ry="22" fill="#000000" opacity="0.6"/>
  <ellipse cx="300" cy="660" rx="130" ry="15" fill="#e06d92" opacity="0.25"/>

  <!-- Energy Power Trails -->
  <path d="M100 520 Q 260 620 500 460" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" filter="url(#powerStrikeGlow)"/>
  <path d="M140 480 Q 280 570 470 420" stroke="#ffd700" stroke-width="3" stroke-linecap="round"/>

  <!-- CR7 Character -->
  <g filter="url(#cr7DropShadow)">
    <!-- Legs & Cleats -->
    <path d="M230 460 L200 560 L160 600 L210 615 L235 560 L270 460 Z" fill="#1c0404" stroke="#450a0a" stroke-width="2"/>
    <path d="M160 600 L140 615 L200 625 L210 610 Z" fill="url(#crGoldTrim)" stroke="#991b1b" stroke-width="1.5"/>

    <!-- High Jumping Power Kick Leg -->
    <path d="M330 450 L400 510 L470 525 L480 490 L400 440 Z" fill="#1c0404" stroke="#450a0a" stroke-width="2"/>
    <path d="M470 525 L510 535 L500 505 L480 490 Z" fill="url(#crSkin)"/>
    <path d="M500 505 L550 490 L540 525 L505 540 Z" fill="url(#crGoldTrim)" stroke="#b91c1c" stroke-width="2" filter="url(#powerStrikeGlow)"/>

    <!-- Athletic Muscular Torso & #7 Jersey -->
    <path d="M220 230 L380 230 L390 460 L210 460 Z" fill="url(#crJersey)" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Gold Cyber Rib Lines -->
    <path d="M240 230 L260 230 L280 460 L260 460 Z" fill="url(#crGoldTrim)" opacity="0.8"/>
    <path d="M340 230 L360 230 L340 460 L320 460 Z" fill="url(#crGoldTrim)" opacity="0.8"/>

    <!-- Number 7 Emblem -->
    <text x="300" y="360" font-family="'Rajdhani', sans-serif" font-weight="900" font-size="70" fill="url(#crGoldTrim)" text-anchor="middle">7</text>
    <text x="300" y="280" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="4">RONALDO</text>

    <!-- Arms -->
    <path d="M220 230 L150 280 L170 320 L230 270 Z" fill="url(#crJersey)"/>
    <path d="M150 280 L110 340 L135 355 L170 320 Z" fill="url(#crSkin)"/>
    
    <path d="M380 230 L450 280 L430 320 L370 270 Z" fill="url(#crJersey)"/>
    <path d="M450 280 L490 340 L465 355 L430 320 Z" fill="url(#crSkin)"/>

    <!-- Head & Sharp Fade Haircut -->
    <path d="M280 190 L320 190 L325 235 L275 235 Z" fill="url(#crSkin)"/>
    <ellipse cx="300" cy="150" rx="40" ry="50" fill="url(#crSkin)"/>
    
    <!-- Sharp Black Pompadour / Fade Haircut -->
    <path d="M260 145 C255 85 345 80 345 130 C350 150 335 155 325 155 C310 110 275 115 268 150 Z" fill="#111827"/>
  </g>

  <!-- 3D Speed Flame Football -->
  <g transform="translate(510, 440)" filter="url(#powerStrikeGlow)">
    <circle cx="0" cy="0" r="44" fill="#ffffff" stroke="#f43f5e" stroke-width="2.5"/>
    <polygon points="0,-16 15,-5 9,13 -9,13 -15,-5" fill="#1e1b4b"/>
    <circle cx="0" cy="0" r="52" stroke="#e06d92" stroke-width="2.5" stroke-dasharray="20 10" opacity="0.85"/>
  </g>
</svg>
