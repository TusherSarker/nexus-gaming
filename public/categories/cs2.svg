  </defs>
  <rect width="200" height="200" rx="36" fill="url(#cs-bg)"/>
  <rect x="3" y="3" width="194" height="194" rx="33" fill="none" stroke="#F97316" stroke-width="2" stroke-opacity="0.4"/>
  
