<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Nexus Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'nexus': { 900: '#0a0e17', 800: '#111827', 700: '#1a2035', 600: '#2a3148', 950: '#060a12' },
            'cyan-accent': '#00f0ff',
            'magenta-accent': '#ff2d78',
            'gold-accent': '#ffd700',
            'success': '#22c55e',
            'warning': '#f59e0b',
            'danger': '#ef4444',
          },
          fontFamily: {
            heading: ['Rajdhani', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0e17; color: white; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Rajdhani', sans-serif; }
  </style>
</head>
<body class="bg-nexus-900 text-white">

  <main class="p-6 max-w-7xl mx-auto space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold font-heading tracking-wider">CATEGORIES</h1>
        <p class="text-gray-400 mt-1">Manage gaming categories and product groupings</p>
      </div>
      <button onclick="openCategoryModal()" class="flex items-center gap-2 px-4 py-2 bg-cyan-accent hover:bg-cyan-accent/90 text-nexus-900 font-bold rounded-lg transition-colors shadow-glow-cyan-sm">
        <i data-lucide="plus" class="w-5 h-5"></i>
        Add Category
      </button>
    </div>

    <!-- Table -->
    <div class="bg-nexus-800/80 backdrop-blur-xl border border-white/5 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <thead class="bg-nexus-700/50">
            <tr class="text-gray-400 text-sm border-b border-white/10">
              <th class="p-4 font-medium">Category Name</th>
              <th class="p-4 font-medium">Slug</th>
              <th class="p-4 font-medium">Description</th>
              <th class="p-4 font-medium">Status</th>
              <th class="p-4 font-medium text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="categoriesTableBody" class="text-sm divide-y divide-white/5">
            <tr>
              <td colspan="5" class="p-8 text-center text-gray-400">Loading categories...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Category Modal -->
  <div id="categoryModal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeCategoryModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-nexus-800 border border-white/10 rounded-2xl shadow-2xl p-6">
      <div class="flex items-center justify-between mb-6">
        <h2 id="modalTitle" class="text-2xl font-bold font-heading">Add Category</h2>
        <button onclick="closeCategoryModal()" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form id="categoryForm" class="space-y-4">
        <input type="hidden" id="categoryId">
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Category Name *</label>
          <input type="text" id="categoryName" required class="w-full px-3 py-2 bg-nexus-700 border border-white/10 rounded-lg text-white focus:ring-2 focus:ring-cyan-accent/50 outline-none">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Description</label>
          <textarea id="categoryDesc" rows="3" class="w-full px-3 py-2 bg-nexus-700 border border-white/10 rounded-lg text-white focus:ring-2 focus:ring-cyan-accent/50 outline-none" placeholder="Description of category items..."></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">Icon (Lucide name)</label>
          <input type="text" id="categoryIcon" placeholder="e.g. keyboard, mouse, headphones, gamepad-2, monitor, package" class="w-full px-3 py-2 bg-nexus-700 border border-white/10 rounded-lg text-white focus:ring-2 focus:ring-cyan-accent/50 outline-none">
        </div>
        
        <label class="flex items-center gap-2 cursor-pointer mt-4">
          <input type="checkbox" id="categoryActive" checked class="rounded border-white/10 bg-nexus-700 text-cyan-accent focus:ring-cyan-accent/50 w-4 h-4">
          <span class="text-sm font-medium text-gray-300">Active</span>
        </label>

        <div class="mt-6 flex justify-end gap-3 pt-6 border-t border-white/10">
          <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 bg-nexus-700 hover:bg-nexus-600 text-white rounded-lg transition-colors">Cancel</button>
          <button type="submit" id="saveCategoryBtn" class="px-4 py-2 bg-cyan-accent hover:bg-cyan-accent/90 text-nexus-900 font-bold rounded-lg transition-colors">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let categoriesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      if (window.lucide) lucide.createIcons();
      loadCategories();
    });

    async function loadCategories() {
      try {
        const res = await api.get('/categories');
        categoriesList = res.data || [];
        renderCategories(categoriesList);
      } catch (err) {
        console.error('Error loading categories:', err);
        document.getElementById('categoriesTableBody').innerHTML = `
          <tr><td colspan="5" class="p-8 text-center text-danger">Failed to load categories.</td></tr>
        `;
      }
    }

    function renderCategories(categories) {
      const tbody = document.getElementById('categoriesTableBody');
      if (categories.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">No categories found.</td></tr>`;
        return;
      }

      tbody.innerHTML = categories.map(c => `
        <tr class="hover:bg-white/5 transition-colors">
          <td class="p-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-nexus-900 border border-white/10 flex items-center justify-center p-1 overflow-hidden">
                ${c.image ? `<img src="${c.image}" alt="${c.name}" class="w-full h-full object-contain">` : `<i data-lucide="${c.icon || 'package'}" class="text-cyan-accent"></i>`}
              </div>
              <span class="font-medium text-white">${c.name}</span>
            </div>
          </td>
          <td class="p-4 text-gray-400 font-mono text-xs">${c.slug || ''}</td>
          <td class="p-4 text-gray-400 text-xs max-w-xs truncate">${c.description || '-'}</td>
          <td class="p-4">
            <span class="px-2.5 py-1 text-xs font-medium rounded-full border ${c.active !== false ? 'bg-success/20 text-success border-success/30' : 'bg-gray-500/20 text-gray-400 border-gray-500/30'} capitalize">
              ${c.active !== false ? 'Active' : 'Draft'}
            </span>
          </td>
          <td class="p-4">
            <div class="flex items-center justify-end gap-2">
              <button onclick="editCategory('${c._id}')" class="p-2 text-gray-400 hover:text-cyan-accent bg-nexus-700 hover:bg-nexus-600 rounded-lg transition-colors" title="Edit">
                <i data-lucide="edit-2" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteCategory('${c._id}')" class="p-2 text-gray-400 hover:text-danger bg-nexus-700 hover:bg-nexus-600 rounded-lg transition-colors" title="Delete">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    const modal = document.getElementById('categoryModal');

    function openCategoryModal() {
      document.getElementById('modalTitle').textContent = 'Add Category';
      document.getElementById('categoryForm').reset();
      document.getElementById('categoryId').value = '';
      modal.classList.remove('hidden');
    }

    function closeCategoryModal() {
      modal.classList.add('hidden');
    }

    function editCategory(id) {
      const c = categoriesList.find(x => x._id === id);
      if (!c) return;
      document.getElementById('modalTitle').textContent = 'Edit Category';
      document.getElementById('categoryId').value = c._id;
      document.getElementById('categoryName').value = c.name || '';
      document.getElementById('categoryDesc').value = c.description || '';
      document.getElementById('categoryIcon').value = c.icon || '';
      document.getElementById('categoryActive').checked = c.active !== false;
      modal.classList.remove('hidden');
    }

    async function deleteCategory(id) {
      if (confirm('Are you sure you want to delete this category?')) {
        try {
          await api.delete(`/categories/${id}`);
          showToast('Category deleted successfully', 'success');
          loadCategories();
        } catch (err) {
          showToast(err.message || 'Failed to delete category', 'error');
        }
      }
    }

    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveCategoryBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const id = document.getElementById('categoryId').value;
      const payload = {
        name: document.getElementById('categoryName').value,
        description: document.getElementById('categoryDesc').value,
        icon: document.getElementById('categoryIcon').value,
        active: document.getElementById('categoryActive').checked,
      };

      try {
        if (id) {
          await api.put(`/categories/${id}`, payload);
          showToast('Category updated successfully!', 'success');
        } else {
          await api.post('/categories', payload);
          showToast('Category created successfully!', 'success');
        }
        closeCategoryModal();
        loadCategories();
      } catch (err) {
        showToast(err.message || 'Failed to save category', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Category';
      }
    });
  </script>
</body>
</html>
