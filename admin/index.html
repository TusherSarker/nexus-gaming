<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Nexus Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'nexus': { 900: '#0a0e17', 800: '#111827', 700: '#1a2035', 600: '#2a3148', 950: '#060a12' },
            'cyan-accent': '#00f0ff',
            'magenta-accent': '#ff2d78',
            'gold-accent': '#ffd700',
            'success': '#22c55e',
            'warning': '#f59e0b',
            'danger': '#ef4444',
          },
          fontFamily: {
            heading: ['Rajdhani', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0e17; color: white; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-nexus-900 relative overflow-hidden">
  
  <!-- Ambient background elements -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-accent/10 blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-magenta-accent/10 blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-md p-8 bg-nexus-800/80 backdrop-blur-xl border border-white/5 rounded-2xl shadow-2xl relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyan-accent/10 mb-4">
        <i data-lucide="gamepad-2" class="w-8 h-8 text-cyan-accent"></i>
      </div>
      <h1 class="font-heading text-3xl font-bold text-white tracking-wider">NEXUS ADMIN</h1>
      <p class="text-gray-400 mt-2">Enter your credentials to access the portal</p>
    </div>

    <form id="loginForm" class="space-y-6">
      <div id="errorMessage" class="hidden p-3 rounded-lg bg-danger/20 border border-danger/50 text-danger text-sm font-medium flex items-start gap-2">
        <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
        <span id="errorText"></span>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="mail" class="h-5 w-5 text-gray-500"></i>
          </div>
          <input type="email" id="email" required
            class="block w-full pl-10 pr-3 py-2.5 bg-nexus-700 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-accent/50 focus:border-transparent transition-all"
            placeholder="admin@nexusgaming.com">
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i data-lucide="lock" class="h-5 w-5 text-gray-500"></i>
          </div>
          <input type="password" id="password" required
            class="block w-full pl-10 pr-3 py-2.5 bg-nexus-700 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-cyan-accent/50 focus:border-transparent transition-all"
            placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 px-4 bg-cyan-accent hover:bg-cyan-accent/90 text-nexus-900 font-bold rounded-lg shadow-[0_0_15px_rgba(0,240,255,0.3)] hover:shadow-[0_0_25px_rgba(0,240,255,0.5)] transition-all flex items-center justify-center gap-2">
        <span id="btnText">Sign In to Dashboard</span>
        <i data-lucide="arrow-right" id="btnIcon" class="w-5 h-5"></i>
        <i data-lucide="loader-2" id="loadingIcon" class="w-5 h-5 animate-spin hidden"></i>
      </button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const loadingIcon = document.getElementById('loadingIcon');

      // Reset state
      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Signing in...';
      btnIcon.classList.add('hidden');
      loadingIcon.classList.remove('hidden');

      try {
        await login(email, password);
      } catch (error) {
        errorMsg.classList.remove('hidden');
        errorText.textContent = error.message;
        
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Dashboard';
        btnIcon.classList.remove('hidden');
        loadingIcon.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
