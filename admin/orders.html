<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Tusher Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'nexus': { 950: '#07080c', 900: '#0b0d13', 800: '#131620', 700: '#191d2a', 600: '#232838' },
            'cyan-accent': '#d47f97',
            'magenta-accent': '#e06d92',
            'gold-accent': '#f2c4ce',
            'success': '#34d399',
            'warning': '#f59e0b',
            'danger': '#ef4444',
          },
          fontFamily: {
            heading: ['Rajdhani', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0d13; color: white; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Rajdhani', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-nexus-900 text-white">

  <main class="p-6 max-w-7xl mx-auto space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-bold font-heading tracking-wider">ORDERS</h1>
        <p class="text-gray-400 mt-1">Manage, fulfill, and update customer gear orders</p>
      </div>
    </div>

    <!-- Filters & Search -->
    <div class="flex flex-col sm:flex-row gap-4 bg-nexus-800/80 backdrop-blur-xl border border-white/5 p-4 rounded-2xl">
      <div class="relative flex-1">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="text" id="orderSearch" placeholder="Search orders by ID, name, or email..." class="w-full pl-10 pr-4 py-2 bg-nexus-700 border border-white/10 rounded-lg text-white focus:ring-2 focus:ring-cyan-accent/50 outline-none">
      </div>
      <div class="flex gap-4">
        <select id="statusFilter" class="bg-nexus-700 border border-white/10 rounded-lg px-4 py-2 text-white outline-none focus:ring-2 focus:ring-cyan-accent/50 min-w-[160px]">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-nexus-800/80 backdrop-blur-xl border border-white/5 rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[900px]">
          <thead class="bg-nexus-700/50">
            <tr class="text-gray-400 text-sm border-b border-white/10">
              <th class="p-4 font-medium">Order ID</th>
              <th class="p-4 font-medium">Date</th>
              <th class="p-4 font-medium">Customer</th>
              <th class="p-4 font-medium">Items</th>
              <th class="p-4 font-medium">Total</th>
              <th class="p-4 font-medium">Status</th>
              <th class="p-4 font-medium text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="text-sm divide-y divide-white/5">
            <tr>
              <td colspan="7" class="p-8 text-center text-gray-400">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Order Detail Modal -->
  <div id="orderModal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeOrderModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-xl max-h-[90vh] overflow-y-auto bg-nexus-800 border border-white/10 rounded-2xl shadow-2xl p-6">
      <div class="flex items-center justify-between mb-6 border-b border-white/10 pb-4">
        <div>
          <h2 id="modalOrderTitle" class="text-2xl font-bold font-heading text-cyan-accent">Order Details</h2>
          <p id="modalOrderDate" class="text-xs text-gray-400 mt-0.5"></p>
        </div>
        <button onclick="closeOrderModal()" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <div id="modalOrderContent" class="space-y-4 text-sm">
        <!-- Filled by JS -->
      </div>

      <div class="mt-6 flex justify-end pt-4 border-t border-white/10">
        <button onclick="closeOrderModal()" class="px-4 py-2 bg-nexus-700 hover:bg-nexus-600 text-white rounded-lg transition-colors">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    let ordersList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      if (window.lucide) lucide.createIcons();
      loadOrders();

      document.getElementById('orderSearch').addEventListener('input', () => filterAndRenderOrders());
      document.getElementById('statusFilter').addEventListener('change', () => filterAndRenderOrders());
    });

    const statusColors = {
      pending: 'bg-warning/20 text-warning border-warning/30',
      processing: 'bg-blue-500/20 text-blue-400 border-blue-500/30',
      shipped: 'bg-cyan-accent/20 text-cyan-accent border-cyan-accent/30',
      delivered: 'bg-success/20 text-success border-success/30',
      cancelled: 'bg-danger/20 text-danger border-danger/30'
    };

    async function loadOrders() {
      try {
        const res = await api.get('/orders');
        ordersList = res.data || [];
        filterAndRenderOrders();
      } catch (err) {
        console.error('Error loading orders:', err);
        document.getElementById('ordersTableBody').innerHTML = `
          <tr><td colspan="7" class="p-8 text-center text-danger">Failed to load orders.</td></tr>
        `;
      }
    }

    function filterAndRenderOrders() {
      const search = document.getElementById('orderSearch').value.toLowerCase().trim();
      const status = document.getElementById('statusFilter').value;

      const filtered = ordersList.filter(o => {
        const orderId = (o.orderNumber || o._id).toLowerCase();
        const customer = (o.customerName || (o.user && o.user.name) || o.customerEmail || '').toLowerCase();
        const email = (o.customerEmail || (o.user && o.user.email) || '').toLowerCase();

        const matchSearch = !search || orderId.includes(search) || customer.includes(search) || email.includes(search);
        const matchStatus = !status || o.status === status;
        return matchSearch && matchStatus;
      });

      renderOrders(filtered);
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">No orders match your filter.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => {
        const customer = o.customerName || (o.user && o.user.name) || 'Guest User';
        const email = o.customerEmail || (o.user && o.user.email) || 'N/A';
        const dateStr = new Date(o.createdAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const itemsCount = (o.items || []).reduce((sum, item) => sum + (item.qty || 1), 0);

        return `
          <tr class="hover:bg-white/5 transition-colors">
            <td class="p-4 font-mono font-medium text-cyan-accent">#${o.orderNumber || o._id.substring(18)}</td>
            <td class="p-4 text-gray-400 text-xs">${dateStr}</td>
            <td class="p-4">
              <div class="font-medium text-white">${customer}</div>
              <div class="text-xs text-gray-400 font-mono">${email}</div>
            </td>
            <td class="p-4 text-gray-300">${itemsCount} item${itemsCount !== 1 ? 's' : ''}</td>
            <td class="p-4 font-mono font-semibold text-cyan-accent">$${Math.round(o.total || 0)}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 text-xs font-medium rounded-full border ${statusColors[o.status] || statusColors.pending} uppercase tracking-wider">
                ${o.status}
              </span>
            </td>
            <td class="p-4">
              <div class="flex items-center justify-end gap-2">
                <select class="bg-nexus-700 border border-white/10 rounded px-2 py-1 text-xs text-white outline-none focus:border-cyan-accent cursor-pointer" onchange="updateOrderStatus('${o._id}', this.value)">
                  <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>Processing</option>
                  <option value="shipped" ${o.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                  <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                  <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
                <button onclick="viewOrderDetails('${o._id}')" class="p-1.5 text-gray-400 hover:text-white bg-nexus-700 hover:bg-nexus-600 rounded transition-colors" title="View Details">
                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    async function updateOrderStatus(id, newStatus) {
      try {
        await api.put(`/orders/${id}`, { status: newStatus });
        const order = ordersList.find(o => o._id === id);
        if (order) order.status = newStatus;
        filterAndRenderOrders();
        showToast(`Order status updated to ${newStatus.toUpperCase()}`, 'success');
      } catch (err) {
        showToast(err.message || 'Failed to update order status', 'error');
      }
    }

    function viewOrderDetails(id) {
      const o = ordersList.find(x => x._id === id);
      if (!o) return;

      document.getElementById('modalOrderTitle').textContent = `Order #${o.orderNumber || o._id.substring(18)}`;
      document.getElementById('modalOrderDate').textContent = `Placed on ${new Date(o.createdAt).toLocaleString()}`;

      const customer = o.customerName || (o.user && o.user.name) || 'Guest User';
      const email = o.customerEmail || (o.user && o.user.email) || 'N/A';
      const addr = o.shippingAddress || {};

      let itemsHtml = (o.items || []).map(item => `
        <div class="flex items-center justify-between py-2 border-b border-white/5">
          <div class="flex items-center gap-3">
            <img src="${item.image || '/products/gaming_headset.jpg'}" class="w-10 h-10 rounded bg-nexus-900 object-contain p-1">
            <div>
              <p class="font-medium text-white text-sm">${item.name}</p>
              <p class="text-xs text-gray-400 font-mono">Qty: ${item.qty} × $${Math.round(item.price || 0)}</p>
            </div>
          </div>
          <span class="font-mono font-bold text-cyan-accent">$${Math.round((item.price || 0) * (item.qty || 1))}</span>
        </div>
      `).join('');

      document.getElementById('modalOrderContent').innerHTML = `
        <div class="bg-nexus-900/60 p-4 rounded-xl space-y-2">
          <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Customer Information</p>
          <p class="text-white font-medium">${customer} <span class="text-gray-400 font-normal">(${email})</span></p>
          ${addr.street ? `<p class="text-xs text-gray-300">${addr.street}, ${addr.city || ''}, ${addr.state || ''} ${addr.zip || ''}, ${addr.country || ''}</p>` : ''}
        </div>

        <div class="space-y-1">
          <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-2">Order Items</p>
          ${itemsHtml}
        </div>

        <div class="bg-nexus-900/40 p-4 rounded-xl space-y-2 font-mono text-xs">
          <div class="flex justify-between text-gray-400"><span>Subtotal:</span><span>$${Math.round(o.subtotal || o.total || 0)}</span></div>
          ${o.discount ? `<div class="flex justify-between text-magenta-accent"><span>Discount:</span><span>-$${Math.round(o.discount)}</span></div>` : ''}
          <div class="flex justify-between text-gray-400"><span>Shipping:</span><span>${o.shipping === 0 ? 'Free' : '$' + Math.round(o.shipping || 0)}</span></div>
          <div class="flex justify-between text-white font-bold text-base pt-2 border-t border-white/10">
            <span>Total:</span><span class="text-cyan-accent">$${Math.round(o.total || 0)}</span>
          </div>
        </div>
      `;

      document.getElementById('orderModal').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeOrderModal() {
      document.getElementById('orderModal').classList.add('hidden');
    }
  </script>
</body>
</html>
